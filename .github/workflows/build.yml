name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/zoom

defaults:
  run:
    working-directory: zoom

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: zoom

      - uses: jdx/mise-action@v2
        with:
          working_directory: zoom

      - uses: taiki-e/install-action@nextest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zoom/target
          key: cargo-${{ hashFiles('zoom/Cargo.lock', 'zoom/rust-toolchain.toml') }}
          restore-keys: |
            cargo-

      - run: mise run check
      - run: mise run test
      - run: mise run package

      - uses: actions/upload-artifact@v7
        with:
          name: alaydriem-zoom-${{ github.sha }}-windows-x64
          path: zoom/dist/@alaydriem/zoom/
