[tasks.preflight]
description = "Names a missing toolchain or tool before a build turns it into an obscure error"
dir = "{{config_root}}"
run = [
  "rustc --version",
  "cargo --version",
  "cargo nextest --version",
]

[tasks.check]
description = "Compiles, runs clippy with warnings denied and checks formatting"
dir = "{{config_root}}"
run = [
  "cargo check --workspace --all-targets",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo fmt --all --check",
]

[tasks.test]
description = "Every test through cargo nextest run"
dir = "{{config_root}}"
run = "cargo nextest run --workspace"

[tasks.package]
description = "Builds dist/@alaydriem/zoom/ (alaydriem_zoom.dll, amml.hcl), the release artifact"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -e
cargo build --release -p zoom-amml
rm -rf dist/alaydriem-zoom dist/@alaydriem/zoom
mkdir -p dist/@alaydriem/zoom
cp target/release/alaydriem_zoom.dll dist/@alaydriem/zoom/alaydriem_zoom.dll
cp zoom/amml/amml.hcl dist/@alaydriem/zoom/amml.hcl
echo "built dist/@alaydriem/zoom"
'''

[tasks.bench]
description = "Criterion benches for the per-frame hot paths; arguments narrow the run"
dir = "{{config_root}}"
run = "cargo bench -p zoom-bench --bench zoom --"

[tasks.install]
description = "Runs package, then copies dist/@alaydriem/zoom into mods/amml/@alaydriem/zoom of an AMML instance under %LOCALAPPDATA%/amml/instances (--instance, default 1.26.60.05). The mod's config/ stays. Close the game first: a running game locks the DLL"
depends = ["package"]
dir = "{{config_root}}"
shell = "bash -c"
usage = '''
flag "--instance <name>" default="1.26.60.05" help="The instance folder under %LOCALAPPDATA%/amml/instances"
'''
run = '''
set -e
[ -n "$LOCALAPPDATA" ] || { echo "LOCALAPPDATA is not set; the instances live under %LOCALAPPDATA%/amml/instances"; exit 1; }
instance="$LOCALAPPDATA/amml/instances/${usage_instance:-1.26.60.05}"
[ -f "$instance/Minecraft.Windows.exe" ] || { echo "no instance at $instance"; exit 1; }
target="$instance/mods/amml/@alaydriem/zoom"
mkdir -p "$target"
cp -r dist/@alaydriem/zoom/. "$target/"
echo "installed dist/@alaydriem/zoom -> $target"
'''
